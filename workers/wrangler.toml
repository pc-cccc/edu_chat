# Edu_chat Worker 部署配置（依赖 jose，用 wrangler 打包后部署）
# 步骤：cd workers && npm install && npx wrangler login && npx wrangler deploy
name = "edu-chat-worker"
main = "worker.js"
compatibility_date = "2024-11-01"

# 公开变量（可见，不含密钥）。部署前把占位符换成真实值：
[vars]
# 允许跨域调用的前端域名，多个用英文逗号分隔
ALLOWED_ORIGINS = "https://your-project.pages.dev"
# Supabase 项目 URL（同时用于 JWT 的 JWKS/issuer 校验）
SUPABASE_URL = "https://ctthcqwnzmyijuemtwzi.supabase.co"
# Supabase 的 anon public 密钥（公开值，用于以用户身份调用 PostgREST 做文件归属校验）
SUPABASE_ANON_KEY = "your-anon-key"

# 密钥变量（务必用命令设置，不要写进本文件或提交 Git）：
#   npx wrangler secret put DEEPSEEK_API_KEY      # 你的 DeepSeek 密钥 sk-...
#   npx wrangler secret put SUPABASE_JWT_SECRET   # 可选：旧 HS256 项目才需要，见 worker.js

# 附件功能必需：Supabase legacy service_role key，仅 Worker Secret，禁止放 Pages 构建变量。
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
